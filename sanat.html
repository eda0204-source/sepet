<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanatçılar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background-image:  linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('monet.jpg');
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Üst Menü */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.4);
            background-image: linear-gradient(rgba(67, 44, 12, 0.7), rgba(104, 95, 95, 0.7)), url('van gogh.jpg');
            background-size: cover;
            background-position: center;
        }
        

        .logo {
            font-size: 1.4rem;
            letter-spacing: 2px;
            color: #d4af37; /* Altın sarısı */
            text-decoration: none;
            text-transform: uppercase;
            font-style: italic; /* İtalik yapıldı */
        }

        .back-btn {
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem;
            font-style: italic; /* İtalik yapıldı */
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: #d4af37;
        }

        /* Sayfayı Dikey ve Yatay Olarak Tam Ortalayan Alan */
        .wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* 4 Fotoğrafın Yan Yana Dizilimi */
        .gallery {
            display: flex;
            justify-content: center;
            gap: 35px;
            flex-wrap: wrap;
        }

        /* Her Bir Sanatçı Bloğu */
        .item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 210px;
        }

        /* Fotoğraf ve Altın Çerçevesi */
        .item img {
            width: 210px;
            height: 290px;
            object-fit: cover;
            border: 5px solid #d4af37; /* Altın Sarısı Çerçeve */
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            margin-bottom: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .item img:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.7);
        }

        /* Altın Sarısı İtalik Buton */
        .artist-btn {
            width: 100%;
            padding: 10px 0;
            background: transparent;
            color: #d4af37; /* Altın sarısı yazı */
            border: 1.5px solid #d4af37; /* Altın sarısı kenarlık */
            text-align: center;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: 'Georgia', serif;
            font-style: italic; /* İtalik eklendi */
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .artist-btn:hover {
            background: #d4af37;
            color: #000000;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">SANAT & FELSEFE</a>
        <a href="index.html" class="back-btn">← Ana Sayfaya Dön</a>
    </header>

    <div class="wrapper">
        <div class="gallery">
            
            <!-- Caravaggio -->
            <div class="item">
                <img src="123.jpg" alt="Caravaggio">
                <a href="caravaggio.html" class="artist-btn">CARAVAGGIO</a>
            </div>

            <!-- Vincent van Gogh -->
            <div class="item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/1280px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg" alt="Van Gogh">
                <a href="vangogh.html" class="artist-btn">VAN GOGH</a>
            </div>

            <!-- Claude Monet -->
            <div class="item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/Claude_Monet%2C_Impression%2C_soleil_levant.jpg/1280px-Claude_Monet%2C_Impression%2C_soleil_levant.jpg" alt="Monet">
                <a href="claudemonet.html" class="artist-btn">MONET</a>
            </div>

            <!-- Gustav Klimt -->
            <div class="item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/40/The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg" alt="Gustav Klimt">
                <a href="klimt.html" class="artist-btn">GUSTAV KLIMT</a>
            </div>

        </div>
    </div>

</body>
</html>
